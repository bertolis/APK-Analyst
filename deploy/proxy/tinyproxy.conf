User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Only clients on the internal Docker network reach this proxy; allow them all.
Allow 0.0.0.0/0

# Default-deny: only hosts matching an entry in the filter file are allowed.
Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended On
FilterCaseSensitive Off
# Match on the destination host (applies to CONNECT/HTTPS too), not full URLs.
FilterURLs Off

# HTTPS tunneling (CONNECT) only to 443 — no arbitrary ports.
ConnectPort 443

# Keep the proxy quiet and non-persistent.
LogLevel Warning
MaxClients 100
